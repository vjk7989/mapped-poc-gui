    function loadGoogleMapsApi(){

      if(!key)return Promise.reject({code:"missing"});
      googleMapsApiPromise=new Promise((resolve,reject)=>{
        const callback=`palmWatchGoogleMapsReady${Date.now()}`,script=document.createElement("script");
        let settled=false;
        const finish=(error)=>{if(settled)return;settled=true;clearTimeout(timer);window.removeEventListener("error",onWindowError);delete window[callback];if(error){googleMapsApiPromise=null;reject(error);}else resolve(window.google.maps);};
        const onWindowError=event=>{const message=String(event.message||event.error?.message||"");if(message.includes("MapError"))finish({code:googleMapsErrorCode(message)});};
        const previousAuthFailure=window.gm_authFailure;
        window.gm_authFailure=()=>{finish({code:"auth"});if(typeof previousAuthFailure==="function")previousAuthFailure();};
        window[callback]=()=>finish(window.google?.maps?.Map?null:{code:"api"});
        script.id="palmwatchGoogleMapsApi";
        script.async=true;
        script.defer=true;
        script.onerror=()=>finish({code:"network"});
        script.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&loading=async&v=weekly&callback=${callback}`;
        window.addEventListener("error",onWindowError);

      });
      return googleMapsApiPromise;

      const farms=flatFarms(scopedDistricts()), m=metricsFor(farms);
      content.innerHTML = `<div class="pagehead"><div><h1 class="h1">${state.page}</h1><p class="sub">Functional AP-only ${state.page.toLowerCase()} workspace. Data respects the selected role scope and excludes non-AP regions.</p></div></div>${metricStrip(m)}<div class="panel"><div class="paneltitle">${state.page} records<span class="lvl">role scoped</span></div>${farms.slice(0,8).map(f=>`<button class="htr frow" data-farm="${f.id}"><span class="hname"><span class="nm">${f.name}</span><span class="lvl">${f.district}</span></span><span class="num">${fmt(f.trees)}</span><span class="num">${fmt(f.infected)}</span><span class="num">${fmt(f.pending)}</span><span><em class="badge ${hclass(f.risk)}">${hlabel(f.risk)}</em></span></button>`).join("")}</div>`;
      content.querySelectorAll("[data-farm]").forEach(b=>b.addEventListener("click",()=>{state.page="Overview";state.farmId=b.dataset.farm;render()}));
    }
    function renderNewFarm(){
      const areas=flatFarms(scopedDistricts()),observations=areas.flatMap(area=>area.observations||[]);
      content.innerHTML=`<div class="pagehead"><div><h1 class="h1">Survey area management</h1><p class="sub">Open the current survey workspaces to review their operational geofences and tree markers. System Administrator can edit saved spatial data.</p></div><span class="badge h-neutral">${areas.length} survey areas · ${observations.length} trees</span></div>${metricStrip(metricsFor(areas))}<div class="panel"><div class="paneltitle">Current Survey Areas<span class="lvl">live browser state</span></div>${areas.map(area=>{const infected=area.observations.filter(item=>item.displayStatus==="Infected").length,suspected=area.observations.filter(item=>item.displayStatus==="Suspected").length,healthy=area.observations.filter(item=>item.displayStatus==="Healthy").length;return `<button class="htr frow" data-survey-open="${area.id}"><span class="hname"><span class="dot ${infected?"h-bad":suspected?"h-risk":"h-ok"}"></span><span><span class="nm">${escapeHtml(area.name)}</span><span class="lvl">${escapeHtml(area.id)}</span></span></span><span class="num">${fmt(area.trees)} trees</span><span class="num tone-bad">${fmt(infected)} infected</span><span class="num tone-risk">${fmt(suspected)} suspected</span><span class="num tone-ok">${fmt(healthy)} healthy</span><span class="chev">›</span></button>`}).join("")}</div><div class="notice" style="margin-top:18px"><strong>Operational boundaries:</strong> saved geofences and markers are browser-local display positions, not surveyed legal boundaries or ownership records.</div>`;
      content.querySelectorAll("[data-survey-open]").forEach(button=>button.addEventListener("click",()=>{state.farmId=button.dataset.surveyOpen;state.treeId=null;state.page="Overview";render()}));
    }
    render();
  </script>
</body>
</html>
